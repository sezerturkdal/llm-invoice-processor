server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are capped at 10 MB by the API; allow the multipart overhead on top.
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The review screen shows the invoice in a same-origin iframe; other sites may not frame the app.
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamed PDF previews use range requests; pass them through unbuffered.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Vite puts a content hash in asset file names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Client-side routes (/invoices/..., /login) all load the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
