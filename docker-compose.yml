# The whole app: docker compose up --build, then open http://localhost:8080.
# For local development, start only the database (docker compose up -d sqlserver) and run the API and Vite yourself.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: invoiceprocessor-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/InvoiceProcessor.Api/Dockerfile
    container_name: invoiceprocessor-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__InvoiceProcessor: "Server=sqlserver,1433;Database=InvoiceProcessor;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Database__MigrateOnStartup: "true"
      FileStorage__RootPath: /app/uploads
      DataProtection__KeysPath: /app/keys
      Llm__Model: ${LLM_MODEL:-claude-opus-5}
      Llm__ApiKey: ${ANTHROPIC_API_KEY:-}
      Auth__Admin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env (the first admin account)}
      Auth__Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (at least 10 characters)}
    volumes:
      - uploads:/app/uploads
      - keys:/app/keys
    restart: unless-stopped

  web:
    build: ./web
    container_name: invoiceprocessor-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  sqlserver-data:
  uploads:
  keys:
